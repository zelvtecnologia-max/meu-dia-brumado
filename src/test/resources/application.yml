spring:
  application:
    name: meu-dia-api-test

  # H2 Database for tests
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 5

  # JPA/Hibernate for H2
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  # Flyway disabled for tests (uses Hibernate create-drop)
  flyway:
    enabled: false

  # H2 Console (optional)
  h2:
    console:
      enabled: false

# Server
server:
  port: 0

# Logging for tests
logging:
  level:
    com.meudia.api: DEBUG
    org.springframework.test: WARN
    org.hibernate.SQL: DEBUG